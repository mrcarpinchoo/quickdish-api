name: API pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

# A new push to a PR cancels its previous run. Runs on main never cancel each
# other: each one gets its own group, and the deploy jobs queue per environment.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

# Bash with pipefail, so `wrangler ... | tee` fails the step when wrangler fails.
defaults:
  run:
    shell: bash

env:
  IMAGE: quickdish-api:ci
  # Don't attach docker/build-push-action's build records as artifacts.
  DOCKER_BUILD_RECORD_UPLOAD: false

# Every job runs inside the Docker image (see Dockerfile), the same isolated
# environment the team uses locally. Shared steps live in .github/actions/.
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image
        uses: ./.github/actions/build-image
        with:
          tag: ${{ env.IMAGE }}

      - name: Check generated types
        run: docker run --rm "$IMAGE" pnpm cf-typegen:check

      - name: Type check
        run: docker run --rm "$IMAGE" pnpm typecheck

      - name: Lint
        run: docker run --rm "$IMAGE" pnpm lint

      - name: Check formatting
        run: docker run --rm "$IMAGE" pnpm format:check

      # The github-actions reporter writes a results table for the run summary.
      - name: Run unit tests with coverage
        run: >
          docker run --name tests
          -e GITHUB_ACTIONS=true
          -e GITHUB_STEP_SUMMARY=/tmp/summary.md
          "$IMAGE" pnpm test:ci --reporter=github-actions

      - name: Copy test results out of the container
        if: always()
        run: |
          docker cp tests:/app/reports reports || true
          docker cp tests:/app/coverage coverage || true
          if docker cp tests:/tmp/summary.md summary.md; then
            cat summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: reports/junit.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image
        uses: ./.github/actions/build-image
        with:
          tag: ${{ env.IMAGE }}

      - name: Bundle the Worker
        run: |
          docker run --name build "$IMAGE" pnpm build
          docker cp build:/app/dist dist

      - name: Upload Worker bundle
        uses: actions/upload-artifact@v4
        with:
          name: worker-bundle
          path: dist

  # Deploys only run on pushes to main: pull requests stop after Test and Build.
  # The deploy-worker action applies the migrations, deploys and checks /health.
  deploy-dev:
    name: Deploy to Development
    needs: [test, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: Development
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image
        uses: ./.github/actions/build-image
        with:
          tag: ${{ env.IMAGE }}

      - name: Deploy to Development
        id: deploy
        uses: ./.github/actions/deploy-worker
        with:
          image: ${{ env.IMAGE }}
          environment: dev
          # Sample menu and test users: Development only, never Production.
          seed: "true"
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          jwt-secret: ${{ secrets.JWT_SECRET }}

  # Waits for a reviewer to approve the Production environment.
  deploy-prod:
    name: Deploy to Production
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image
        uses: ./.github/actions/build-image
        with:
          tag: ${{ env.IMAGE }}

      - name: Deploy to Production
        id: deploy
        uses: ./.github/actions/deploy-worker
        with:
          image: ${{ env.IMAGE }}
          environment: prod
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          jwt-secret: ${{ secrets.JWT_SECRET }}
