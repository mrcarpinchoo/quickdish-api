name: Deploy Worker
description: Applies the D1 migrations, deploys the API Worker to one environment and smoke-tests /health. Runs inside the API's Docker image.

inputs:
  image:
    description: Docker image to run wrangler in.
    required: true
  environment:
    description: Wrangler environment from wrangler.jsonc (dev or prod).
    required: true
  seed:
    description: Load seed/seed.sql (sample menu and test users). Never for prod.
    default: "false"
  cloudflare-api-token:
    description: Cloudflare API token.
    required: true
  cloudflare-account-id:
    description: Cloudflare account id.
    required: true
  jwt-secret:
    description: JWT_SECRET for the Worker, uploaded with the new version.
    required: true
  sentry-dsn:
    description: SENTRY_DSN for the Worker, uploaded with the new version.
    required: true
  sentry-auth-token:
    description: Sentry auth token, used to upload the source maps.
    required: true
  sentry-org:
    description: Sentry organization slug.
    required: true
  sentry-project:
    description: Sentry project slug.
    required: true

outputs:
  url:
    description: Public URL of the deployed Worker.
    value: ${{ steps.deploy.outputs.url }}

runs:
  using: composite
  steps:
    - name: Apply D1 migrations
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        WRANGLER_ENV: ${{ inputs.environment }}
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
      run: >
        docker run --rm -e CLOUDFLARE_API_TOKEN -e CLOUDFLARE_ACCOUNT_ID
        "$IMAGE" pnpm wrangler d1 migrations apply DB --env "$WRANGLER_ENV" --remote

    - name: Load sample data
      if: inputs.seed == 'true'
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        WRANGLER_ENV: ${{ inputs.environment }}
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
      run: >
        docker run --rm -e CLOUDFLARE_API_TOKEN -e CLOUDFLARE_ACCOUNT_ID
        "$IMAGE" pnpm wrangler d1 execute DB --env "$WRANGLER_ENV" --remote
        --file seed/seed.sql --yes

    # 1. Bundle the Worker with its source map.
    # 2. Stamp both with the same debug ID, so Sentry can match stack traces.
    # 3. Upload the source maps to Sentry (release = commit SHA).
    # 4. Deploy that exact stamped bundle (--no-bundle). The secrets ship with
    #    the new version through --secrets-file.
    - name: Deploy Worker
      id: deploy
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        WRANGLER_ENV: ${{ inputs.environment }}
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
        JWT_SECRET: ${{ inputs.jwt-secret }}
        SENTRY_DSN: ${{ inputs.sentry-dsn }}
        SENTRY_AUTH_TOKEN: ${{ inputs.sentry-auth-token }}
        SENTRY_ORG: ${{ inputs.sentry-org }}
        SENTRY_PROJECT: ${{ inputs.sentry-project }}
      run: |
        for name in JWT_SECRET SENTRY_DSN SENTRY_AUTH_TOKEN; do
          if [ -z "${!name}" ]; then
            echo "::error::$name is empty. Set it in the repository or this GitHub environment's secrets."
            exit 1
          fi
        done
        docker run --rm -e CLOUDFLARE_API_TOKEN -e CLOUDFLARE_ACCOUNT_ID \
          -e JWT_SECRET -e SENTRY_DSN -e SENTRY_AUTH_TOKEN -e SENTRY_ORG \
          -e SENTRY_PROJECT -e WRANGLER_ENV -e VERSION="$GITHUB_SHA" \
          "$IMAGE" sh -c '
            set -e
            printf "JWT_SECRET=%s\nSENTRY_DSN=%s\n" "$JWT_SECRET" "$SENTRY_DSN" > /tmp/secrets.env
            pnpm wrangler deploy --env "$WRANGLER_ENV" --minify --dry-run --outdir dist
            npx --yes @sentry/cli@3.8.2 sourcemaps inject dist
            npx --yes @sentry/cli@3.8.2 sourcemaps upload --release "$VERSION" dist
            pnpm wrangler deploy dist/index.js --config wrangler.jsonc \
              --env "$WRANGLER_ENV" --no-bundle \
              --var "VERSION:$VERSION" --secrets-file /tmp/secrets.env
          ' | tee deploy.log
        url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -n 1)
        if [ -z "$url" ]; then
          echo "::error::Couldn't find the Worker URL in the deploy output"
          exit 1
        fi
        echo "url=$url" >> "$GITHUB_OUTPUT"

    - name: Smoke test
      shell: bash
      env:
        URL: ${{ steps.deploy.outputs.url }}
        WRANGLER_ENV: ${{ inputs.environment }}
      run: |
        for attempt in $(seq 1 12); do
          if body=$(curl -fsS "$URL/health") && jq -e \
            --arg env "$WRANGLER_ENV" --arg version "$GITHUB_SHA" \
            '.status == "ok" and .db == "ok" and .env == $env and .version == $version' \
            <<< "$body" > /dev/null; then
            echo "Healthy: $body"
            exit 0
          fi
          echo "Attempt $attempt: not ready yet (${body:-no response})"
          sleep 5
        done
        echo "::error::$URL/health didn't report the new version"
        exit 1
